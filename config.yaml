seed: 42
reference_date: "2026-11-15"
paths: {raw: data/raw, external: data/external, interim: data/interim, out: outputs}

clean:
  drop_super_overs: true
  min_balls_innings_for_training: 30
  margin_tolerance_runs: 2          # flag innings whose totals disagree with official margin

phases: {powerplay: [1, 6], middle: [7, 15], death: [16, 20]}

tiers:                               # opposition / competition tier weights in aggregation
  IPL: 1.0
  T20I_FM: 1.0                       # both full members
  T20I_ASSOC: 0.5                    # an associate side involved
  EMERGING: 0.6                      # A-teams / emerging

env:
  team_strength_k: 600               # EB shrinkage (balls) of team strength toward comp-season mean
  leave_match_out: true              # team strength for a ball excludes that match's own balls

wp:
  n_folds: 5                         # GroupKFold by match_id, out-of-fold predictions
  # ~120 balls per match share one label -> heavy regularisation needed or the model memorises
  # matches (OOF ECE 0.11 with max_iter 400 / leaf 200). Tuned on OOF log-loss (Stage 4 notes).
  wp2: {max_iter: 100, learning_rate: 0.05, min_samples_leaf: 2000, max_leaf_nodes: 8, l2: 1.0}
  wp1: {max_iter: 150, learning_rate: 0.03, min_samples_leaf: 3000, max_leaf_nodes: 8, l2: 1.0}
  # Innings-break continuity: blend WP1 toward the terminal value 1 - WP2(chase start, target =
  # projected total + 1) over the last N balls of innings 1 (lambda = 1 - balls_left / N).
  # Without it, the final ball of innings 1 had 8x the LI of other death balls (Stage 5 notes).
  # 120 (whole innings) with crr dropped: best WP1 OOF log-loss and a smooth LI-by-over profile.
  inn1_blend_balls: 120
  endgame_dp:                        # exact backward-induction WP2 for the last balls of a chase
    max_balls_left: 3
    grid: {1: [1.0, 0.75, 0.5], 2: [0.5, 0.25, 0.0], 3: [0.25, 0.0]}   # DP weight per balls left
  calibration: auto                # auto = isotonic only if raw OOF ECE >= 0.03 (isotonic steps distort LI)

pressure:
  method: leverage                   # leverage | leverage_x_stakes
  percentile_scope: per_innings      # per_innings | global
  top_pct: 0.20                      # pressure ball = top 20% LI
  stakes: {knockout: 1.25, final: 1.5, enabled: false}
  li_cap_quantile: 0.995             # LI_capped = min(LI, p99.5) - used wherever LI is a weight
  outcome_smoothing_alpha: 300      # p(o) buckets shrink toward parent bucket with this many pseudo-balls

expected:                            # Stage 6 context-only expectation models (same folds as Stage 4)
  poisson: {max_iter: 300, learning_rate: 0.05, min_samples_leaf: 200, max_leaf_nodes: 31}
  # rare-event models overfit with the Poisson settings (OOF pred/actual 1.03); tuned on OOF log-loss
  binary: {max_iter: 150, learning_rate: 0.05, min_samples_leaf: 2000, max_leaf_nodes: 8}
  tol_runs: 0.02                     # |pred/actual - 1| per phase x innings x comp_group cell
  tol_wkts: 0.05
  # a cell also passes if |obs - pred| <= se_slack x sampling SE. 3 ~ Bonferroni over 18 cells per
  # model (2 SE would flag ~1 cell per model by chance). Changed from 2 after a 2.3-SE miss.
  se_slack: 3.0

value:
  li_floor_for_ratio: 0.05           # wpa / LI uses max(LI_capped, floor) so decided-game balls can't explode

recency:
  half_life_days: 730

ratings:
  tau_min_neff: 20                   # players with n_eff >= this enter the tau^2 estimation
  tau_floor: 1.0e-5                  # floor for tau^2 (per-ball units^2)
  tau_method: reml                   # reml (precision-weighted likelihood) | mom (method of moments)
  # k_P from the clutch spread (true P-B variance across players). The REML point estimate is ~0
  # (clutch not detectable), so we use the 95% profile-likelihood UPPER bound: the largest clutch
  # effect consistent with the data. Options: clutch_upper95 | clutch_point | spec_literal
  k_p_method: clutch_upper95

eligibility:
  active_since: "2025-01-01"         # must have played a match on/after this date
  bat_min_pressure_balls: 100
  bat_min_pressure_innings: 12
  bowl_min_pressure_balls: 120
  bowl_min_pressure_spells: 15
  match_min_pressure_balls_bat: 3    # for match-level consistency
  match_min_pressure_balls_bowl: 6

consistency:
  # Beta prior for C. ML finds ~no between-player spread for bowlers (strength ~3e8); like k_P we use
  # the weakest prior the data cannot rule out (95% profile-likelihood lower bound on strength).
  prior_method: upper95_spread       # upper95_spread | ml

composite:
  weight_search: true                # choose weights by temporal validation
  default_weights: {P: 0.50, D: 0.25, C: 0.25}
  # bowler C is near noise (pool spread ~ its bootstrap SE): weight fixed at the floor 0.15; the freed
  # 0.10 goes to P* (the most reliable component), D* keeps its default 0.25
  default_weights_bowl: {P: 0.60, D: 0.25, C: 0.15}
  bowl_fixed_C: 0.15
  min_weight: 0.15
  test_min_pressure_balls: 40        # test-season (IPL 2026) players for the temporal checks
  train_min_pressure_balls: 30       # ... who also have this many train-period pressure balls
  top_guard_min_P_raw: 0.0           # top-list guard: raw pressure value must be at/above expectation

validation:
  bootstrap_reps: 1000
  train_until: "2025-12-31"
  test_comp_prefix: "IPL 2026"

smat:
  enabled: auto                      # auto = use if files present
  ball_weight: 0.5                   # domestic ball counts half

# Section 3 taxonomy (used for tiers / nationality)
teams:
  full_members: [India, Australia, England, South Africa, New Zealand, Pakistan, Sri Lanka, West Indies, Bangladesh, Afghanistan, Ireland, Zimbabwe]
  associates: [Netherlands, Scotland, Nepal, United Arab Emirates, Oman, United States Of America, Canada, Hong Kong, Singapore, Kuwait, Japan]
